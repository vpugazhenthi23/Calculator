<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>

  <!-- Bootstrap 5 (grid + reset) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* 1. Page background and centering */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    /* 2. The calculator body */
    .calc {
      width: 320px;
      padding: 24px;
      border-radius: 24px;
      background: #1e293b;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .calc h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    /* 3. The display */
    .display {
      background: #0f172a;
      color: #f8fafc;
      font-size: 2.2rem;
      text-align: right;
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 20px;
      min-height: 68px;
      overflow-x: auto;
      white-space: nowrap;
    }

    /* 4. Buttons: one shared style, then colour variants */
    .calc .btn {
      width: 100%;
      height: 60px;
      font-size: 1.3rem;
      border: none;
      border-radius: 14px;
      color: #f8fafc;
      background: #334155;
      transition: transform 0.1s, background 0.2s;
    }
    .calc .btn:hover  { background: #475569; }
    .calc .btn:active { transform: scale(0.94); }

    .calc .btn-op    { background: #0d9488; }   /* + - * / */
    .calc .btn-op:hover { background: #14b8a6; }

    .calc .btn-equal { background: #f59e0b; color: #1e293b; }  /* = */
    .calc .btn-equal:hover { background: #fbbf24; }

    .calc .btn-clear { background: #e11d48; }   /* Clear and x */
    .calc .btn-clear:hover { background: #fb7185; }
  </style>
</head>
<body>

  <div class="calc">
    <h1>Calculator</h1>
    <div class="display" id="display">0</div>

    <!-- Bootstrap grid: each col-3 is one quarter of the row -->
    <div class="row g-2">
      <div class="col-3"><button class="btn">1</button></div>
      <div class="col-3"><button class="btn">2</button></div>
      <div class="col-3"><button class="btn">3</button></div>
      <div class="col-3"><button class="btn btn-op">+</button></div>

      <div class="col-3"><button class="btn">4</button></div>
      <div class="col-3"><button class="btn">5</button></div>
      <div class="col-3"><button class="btn">6</button></div>
      <div class="col-3"><button class="btn btn-op">-</button></div>

      <div class="col-3"><button class="btn">7</button></div>
      <div class="col-3"><button class="btn">8</button></div>
      <div class="col-3"><button class="btn">9</button></div>
      <div class="col-3"><button class="btn btn-op">*</button></div>

      <div class="col-3"><button class="btn">0</button></div>
      <div class="col-3"><button class="btn">.</button></div>
      <div class="col-3"><button class="btn btn-equal">=</button></div>
      <div class="col-3"><button class="btn btn-op">/</button></div>

      <!-- col-6 = half the row -->
      <div class="col-6"><button class="btn btn-clear">Clear</button></div>
      <div class="col-6"><button class="btn btn-clear">x</button></div>
    </div>
  </div>

  <script>
    // Minimal logic so you can see the styling working
    const display = document.getElementById("display");
    let expression = "";

    document.querySelectorAll(".calc .btn").forEach(function (button) {
      button.addEventListener("click", function () {
        const value = button.textContent;

        if (value === "Clear") {
          expression = "";
        } else if (value === "x") {
          expression = expression.slice(0, -1);   // delete last character
        } else if (value === "=") {
          try {
            expression = String(Function("return " + expression)());
          } catch {
            expression = "";
            display.textContent = "Error";
            return;
          }
        } else {
          expression += value;
        }

        display.textContent = expression || "0";
      });
    });
  </script>
</body>
</html>
